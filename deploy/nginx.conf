# Caper City: serves the browser build over HTTPS and proxies /ws (wss://) to the game server.
# Installed as /etc/nginx/conf.d/capercity.conf by deploy/deploy.sh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80 only answers Let's Encrypt's checks and sends everyone else to HTTPS:
# Godot's web build refuses to start outside a secure context.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Kept fresh by acme.sh (see deploy/deploy.sh --setup).
    ssl_certificate /etc/nginx/ssl/capercity.crt;
    ssl_certificate_key /etc/nginx/ssl/capercity.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/capercity;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_types application/wasm application/octet-stream application/javascript text/css;
    gzip_min_length 1024;

    # The game server (systemd unit capercity) on localhost.
    location = /ws {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # A new build must replace the old one right away; the files are versioned only by name.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Older mime.types files don't know .wasm; browsers need it to stream-compile the engine.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }
}
