html/head_include="<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<meta name=\"theme-color\" content=\"#15171C\">
<script>
// Phones: go fullscreen and lock to landscape on the first tap (Android; iPhones ignore both).
(function () {
  var phone = /Android|iPhone|iPod/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 600);
  if (!phone) return;
  function go() {
    var d = document.documentElement;
    var req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      var p = req.call(d);
      if (p && p.then) p.then(function () {
        window.removeEventListener('pointerup', go);
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      }).catch(function () {});
    } catch (e) {}
  }
  window.addEventListener('pointerup', go, { passive: true });
})();
</script>"
